# Signet as a single-node domain in Kubernetes, for the interop test.
#
# Genesis runs as an init container: it initializes the domain into the shared
# volume and prints the bootstrap tokens to its log, which is the only moment a
# fresh domain can hand out credentials. Re-running it against an initialized
# domain is safe, so a rescheduled pod recovers rather than crash-looping.
---
apiVersion: v1
kind: Namespace
metadata:
  name: signet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signet-genesis
  namespace: signet
data:
  # Desired state only: who exists, what they may do, and which attested
  # identities become them. Kubernetes is trusted as an attestation source —
  # the cluster already proves what a workload is, so no agent is deployed and
  # no shared secret is distributed.
  #
  # The issuer's key set is pinned from a file (mounted separately, fetched out
  # of band) rather than discovered at request time.
  genesis.json: |
    {
      "principals": [
        {"path": "/clusters/svc/apps/eso", "type": "workload"},
        {"path": "/clusters/svc/apps/certmanager", "type": "workload"}
      ],
      "bindings": [
        {"subject": "/clusters/svc/apps/eso",
         "role": "kv-reader",
         "scope": "/secrets/cluster-svc"},
        {"subject": "/clusters/svc/apps/certmanager",
         "role": "pki-signer",
         "scope": "/pki/server"}
      ],
      "pki_roles": [
        {"name": "server",
         "scope": "/pki/server",
         "allowed_domains": ["svc.cluster.local", "demo.example.com"],
         "allow_subdomains": true,
         "allow_bare_domains": true,
         "max_ttl_seconds": 7776000}
      ],
      "issuers": [
        {"name": "this-cluster",
         "verifier": "k8s-sa",
         "url": "https://kubernetes.default.svc.cluster.local",
         "audience": "signet",
         "jwks_file": "/jwks/jwks.json"}
      ],
      "mappings": [
        {"name": "eso",
         "issuer": "this-cluster",
         "namespaces": ["demo"],
         "service_accounts": ["signet-client"],
         "principal": "/clusters/svc/apps/eso",
         "ttl_seconds": 900},
        {"name": "certmanager",
         "issuer": "this-cluster",
         "namespaces": ["demo"],
         "service_accounts": ["certmanager-client"],
         "principal": "/clusters/svc/apps/certmanager",
         "ttl_seconds": 900}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signet
  namespace: signet
spec:
  replicas: 1
  strategy:
    type: Recreate # one voter owns the data directory
  selector:
    matchLabels: {app: signet}
  template:
    metadata:
      labels: {app: signet}
    spec:
      initContainers:
        - name: genesis
          image: signet:dev
          imagePullPolicy: Never
          args:
            - genesis
            - -data-dir=/data
            - -config=/config/genesis.json
            - -mint=/clusters/svc/apps/eso
            - -ttl=24h
            # The root ceremony. The root key is written outside the data
            # directory and is never proposed, stored, or backed up.
            - -ca-common-name=Signet Test
            - -ca-domains=svc.cluster.local,demo.example.com,signet.svc
            - -root-key-out=/rootkey/root-ca.key
            # Kubernetes will only fetch OIDC discovery over HTTPS, so the
            # domain issues its own serving certificate during the ceremony.
            - -ca-ip-ranges=10.96.0.0/16
            - -server-cert-out=/tls
            - -server-names=signet.signet.svc,10.96.0.20
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config}
            - {name: jwks, mountPath: /jwks}
            # The ceremony writes the root key here, deliberately outside the
            # data volume so it is never part of a backup. A real deployment
            # mounts one-shot storage the operator collects and then destroys.
            - {name: rootkey, mountPath: /rootkey}
            - {name: tls, mountPath: /tls}
      containers:
        - name: signet
          image: signet:dev
          imagePullPolicy: Never
          args:
            - serve
            - -data-dir=/data
            - -listen=0.0.0.0:8200
            - -mount=secrets-home-solcore-dot-net
            - -tree-prefix=/secrets
            - -pki-mount=pki-home-solcore-dot-net
            - -issuer-url=https://10.96.0.20:8200
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
          ports:
            - {name: api, containerPort: 8200}
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: api, scheme: HTTPS}
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /tls}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, configMap: {name: signet-genesis}}
        # Pinned out of band by the test script from the live cluster's OIDC
        # discovery endpoint — Signet never fetches keys from a request.
        - {name: jwks, configMap: {name: signet-jwks}}
        - {name: rootkey, emptyDir: {}}
        - {name: tls, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: signet
  namespace: signet
spec:
  # Pinned: the OIDC issuer URL has to be known before the API server is
  # configured with it, and the API server can route to a ClusterIP but cannot
  # resolve cluster DNS.
  clusterIP: 10.96.0.20
  selector: {app: signet}
  ports:
    - {name: api, port: 8200, targetPort: api}
