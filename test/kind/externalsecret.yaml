# The interop test proper: unmodified External Secrets Operator reading from
# Signet through the Vault-compatible dialect, authenticating as its own
# Kubernetes workload identity.
#
# No shared secret exists anywhere in this file. ESO asks Kubernetes for a
# short-lived token proving which ServiceAccount it is, and Signet — which
# trusts the cluster as an attestation source — turns that proof into a session.
# This is why Kubernetes needs no Signet agent: the cluster already answers the
# hard question of what a workload is.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# The workload identity. Signet's mapping rule accepts exactly this
# (namespace, service account) pair and no other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signet-client
  namespace: demo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: signet
  namespace: demo
spec:
  provider:
    vault:
      server: http://signet.signet.svc:8200
      path: secrets-home-solcore-dot-net # the KV mount clients address
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes # POST /v1/auth/kubernetes/login
          role: eso # names the mapping rule, not a trust anchor
          serviceAccountRef:
            name: signet-client
            # The audience is what stops a token minted for the API server, or
            # for any other service, from being replayed at Signet.
            audiences: ["signet"]
---
# In scope: the mapped principal holds kv-reader at /secrets/cluster-svc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: signet
    kind: SecretStore
  target:
    name: litellm-secret
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: {key: cluster-svc/apps/litellm, property: master-key}
    - secretKey: RUNPOD_API_KEY
      remoteRef: {key: cluster-svc/apps/litellm, property: runpod-api-key}
---
# Out of scope: the same attested identity, a subtree it was never granted.
# This must fail — a negative test is the only proof the authorization is real.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forbidden
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: signet
    kind: SecretStore
  target:
    name: forbidden-secret
  data:
    - secretKey: TOP
      remoteRef: {key: cluster-main/apps/forbidden, property: top}
---
# Absent: a path that does not exist. Exercises the 404-with-empty-errors shape
# the Vault client maps to "no secret", distinct from a permission failure.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: missing
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: signet
    kind: SecretStore
  target:
    name: missing-secret
  data:
    - secretKey: NOPE
      remoteRef: {key: cluster-svc/apps/does-not-exist, property: nope}
---
# A different ServiceAccount in the same namespace. The mapping rule names
# service accounts exactly, so this identity is real, correctly attested, and
# still refused — proof that attestation and authorization are separate steps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: impostor
  namespace: demo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: signet-impostor
  namespace: demo
spec:
  provider:
    vault:
      server: http://signet.signet.svc:8200
      path: secrets-home-solcore-dot-net
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: impostor
            audiences: ["signet"]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: impostor
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: signet-impostor
    kind: SecretStore
  target:
    name: impostor-secret
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: {key: cluster-svc/apps/litellm, property: master-key}
