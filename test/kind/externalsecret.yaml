# The interop test proper: unmodified External Secrets Operator reading from
# Signet through the Vault-compatible dialect.
#
# The ExternalSecret below is shaped exactly like the homelab's real ones —
# `remoteRef: {key, property}` against a KV v2 mount — so what passes here is
# what will pass in production.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Token auth: ESO sends this straight through as X-Vault-Token and validates it
# with auth/token/lookup-self. No login call, so this path needs no attestation
# code at all — which is why it comes before the k8s-SA verifier.
apiVersion: v1
kind: Secret
metadata:
  name: signet-token
  namespace: demo
type: Opaque
stringData:
  token: REPLACED_AT_APPLY_TIME
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: signet
  namespace: demo
spec:
  provider:
    vault:
      server: http://signet.signet.svc:8200
      path: secrets-home-solcore-dot-net # the KV mount clients address
      version: v2
      auth:
        tokenSecretRef:
          name: signet-token
          key: token
---
# In scope: the workload holds kv-reader at /secrets/cluster-svc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: signet
    kind: SecretStore
  target:
    name: litellm-secret
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: {key: cluster-svc/apps/litellm, property: master-key}
    - secretKey: RUNPOD_API_KEY
      remoteRef: {key: cluster-svc/apps/litellm, property: runpod-api-key}
---
# Out of scope: same token, a subtree it was never granted. This must fail —
# a negative test is the only proof the authorization is real.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forbidden
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: signet
    kind: SecretStore
  target:
    name: forbidden-secret
  data:
    - secretKey: TOP
      remoteRef: {key: cluster-main/apps/forbidden, property: top}
---
# Absent: a path that does not exist. Exercises the 404-with-empty-errors shape
# the Vault client maps to "no secret", distinct from a permission failure.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: missing
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: signet
    kind: SecretStore
  target:
    name: missing-secret
  data:
    - secretKey: NOPE
      remoteRef: {key: cluster-svc/apps/does-not-exist, property: nope}
